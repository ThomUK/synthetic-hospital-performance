id: apc_006
title: Emergency readmissions within 30 days
description: Live inpatient discharges followed by an emergency admission of the same person within 30 days, dated by the index discharge, and taking site and specialty from the index spell, so that they align with apc_005 (inpatient discharges, patient alive).
source: derived.spells
aggregate: count
unit: discharges
dimensions: [site, specialty]
