name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # The integration tests open the sample through fakehospdata; keep its
      # cache between runs so the 130 MB download happens once per version.
      - name: Cache the sample dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/fakehospdata
          key: fakehospdata-v3-sample

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
