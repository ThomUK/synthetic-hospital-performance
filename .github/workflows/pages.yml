name: Render and deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::knitr, any::rmarkdown

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache the sample dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/fakehospdata
          key: fakehospdata-v2-sample

      - name: Render the site
        run: quarto render site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
